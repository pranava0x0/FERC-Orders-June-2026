# Runs the test suite and the navigation budget on every pull request and push to main.
# The budget fails the run if any question in tools/nav-questions.json now takes more taps,
# typing or scrolling to answer than tools/nav-baseline.json records; the table lands in the run summary.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Navigation budget
        run: |
          python3 -m http.server 8131 --bind 127.0.0.1 --directory docs >/dev/null 2>&1 &
          sleep 1
          node tools/nav-budget.mjs http://127.0.0.1:8131/ nav-out --check
      - name: Navigation table
        if: always()
        run: test -f nav-out/nav.md && cat nav-out/nav.md >> "$GITHUB_STEP_SUMMARY" || true
